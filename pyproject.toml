[project]
name = "bugwarrior"
version = "0.1.0"

# Needed for pydantic>1.8.
requires-python = "^3.6.1"

dependencies = [
  "click",
  "dogpile.cache>=0.5.3",
  "jinja2>=2.7.2",
  "lockfile>=0.9.1",
  "pydantic[email]",
  "python-dateutil"
  "pytz",
  "requests",
  "taskw>=0.8",
  # Needed for backwards compatibility with python<=3.7.
  "typing-extensions",
]

[project.optional-dependencies]
# XXX No way to avoid this duplication with pip.
all = [
  "flake8",
  "google-api-python-client",
  "google-auth-oauthlib",
  "jira>=0.22",
  "kanboard",
  "keyring",
  "offtrac",
  "phabricator",
  "pyac>=0.1.5",
  "pypandoc",
  "pysimplesoap",
  "pytest",
  "python-bugzilla>=2.0.0",
  "python-debianbts>=2.6.1",
  "responses",
  "sphinx",
  "sphinx-click",
  "v1pysdk",
]
activecollab = ["pypandoc", "pyac>=0.1.5"]
bts = ["pysimplesoap", "python-debianbts>=2.6.1"]
bugzilla = ["python-bugzilla>=2.0.0"]
gmail = ["google-api-python-client", "google-auth-oauthlib"]
jira = ["jira>=0.22"]
kanboard = ["kanboard"]
keyring = ["keyring"]
phabricator = ["phabricator"]
test = ["flake8", "pytest", "responses", "sphinx", "sphinx-click"]
trac = ["offtrac"]
versionone = ["v1pysdk"]

[tool.poetry]
name = "bugwarrior"
version = "0.1.0"
description = "a command line utility for updating your local taskwarrior database from your forge issue trackers"
authors = ["Your Name <you@example.com>"]

# XXX We have to duplicate the dependency specification in poetry.
# See https://github.com/python-poetry/poetry/issues/3332.

[tool.poetry.dependencies]
# Needed for pydantic>1.8.
python = "^3.6.1"
click = "*"
"dogpile.cache" = ">=0.5.3"
jinja2 = ">=2.7.2"
lockfile = ">=0.9.1"
pydantic = {version = "*", extras = ["email"]}
python-dateutil = "*"
pytz = "*"
requests = "*"
taskw = ">=0.8"
# Needed for backwards compatibility with python<=3.7.
typing-extensions = "*"

# Extras
flake8 = { version = "*", optional = true }
google-api-python-client = { version = "*", optional = true }
google-auth-oauthlib = { version = "*", optional = true }
jira = { version = ">=0.22", optional = true }
kanboard = { version = "*", optional = true }
keyring = { version = "*", optional = true }
offtrac = { version = "*", optional = true }
phabricator = { version = "*", optional = true }
pyac = { version = ">=0.1.5", optional = true }
pypandoc = { version = "*", optional = true }
pysimplesoap = { version = "*", optional = true }
pytest = { version = "*", optional = true }
python-bugzilla = { version = ">=2.0.0", optional = true }
python-debianbts = { version = ">=2.6.1", optional = true }
responses = { version = "*", optional = true }
sphinx = { version = "*", optional = true }
sphinx-click = { version = "*", optional = true }
v1pysdk = { version = "*", optional = true }

[tool.poetry.extras]
activecollab = ["pypandoc", "pyac"]
bts = ["pysimplesoap", "python-debianbts"]
bugzilla = ["python-bugzilla"]
gmail = ["google-api-python-client", "google-auth-oauthlib"]
jira = ["jira"]
kanboard = ["kanboard"]
keyring = ["keyring"]
phabricator = ["phabricator"]
test = ["flake8", "pytest", "responses", "sphinx", "sphinx-click"]
trac = ["offtrac"]
versionone = ["v1pysdk"]

# There's no way to install extras in dev-dependencies. See:
# https://github.com/python-poetry/poetry/issues/4118
# https://github.com/python-poetry/poetry/issues/3413
# https://github.com/python-poetry/poetry/pull/5452
[tool.poetry.dev-dependencies]
flake8 = "*"
google-api-python-client = "*"
google-auth-oauthlib = "*"
jira = ">=0.22"
kanboard = "*"
keyring = "*"
offtrac = "*"
phabricator = "*"
pyac = ">=0.1.5"
pypandoc = "*"
pysimplesoap = "*"
pytest = "*"
python-bugzilla = ">=2.0.0"
python-debianbts = ">=2.6.1"
responses = "*"
sphinx = "*"
sphinx-click = "*"
v1pysdk = "*"

[tool.poetry.plugins."bugwarrior.service"]
"azuredevops" = "bugwarrior.services.azuredevops:AzureDevopsService"
"github" = "bugwarrior.services.github:GithubService"
"gitlab" = "bugwarrior.services.gitlab:GitlabService"
"bitbucket" = "bugwarrior.services.bitbucket:BitbucketService"
"trac" = "bugwarrior.services.trac:TracService"
"bts" = "bugwarrior.services.bts:BTSService"
"bugzilla" = "bugwarrior.services.bz:BugzillaService"
"kanboard" = "bugwarrior.services.kanboard:KanboardService"
"teamlab" = "bugwarrior.services.teamlab:TeamLabService"
"redmine" = "bugwarrior.services.redmine:RedMineService"
"activecollab2" = "bugwarrior.services.activecollab2:ActiveCollab2Service"
"activecollab" = "bugwarrior.services.activecollab:ActiveCollabService"
"jira" = "bugwarrior.services.jira:JiraService"
"phabricator" = "bugwarrior.services.phab:PhabricatorService"
"versionone" = "bugwarrior.services.versionone:VersionOneService"
"pagure" = "bugwarrior.services.pagure:PagureService"
"taiga" = "bugwarrior.services.taiga:TaigaService"
"gerrit" = "bugwarrior.services.gerrit:GerritService"
"trello" = "bugwarrior.services.trello:TrelloService"
"youtrack" = "bugwarrior.services.youtrack:YoutrackService"
"gmail" = "bugwarrior.services.gmail:GmailService"
"teamworks_projects" = "bugwarrior.services.teamworks_projects:TeamworksService"
"pivotaltracker" = "bugwarrior.services.pivotaltracker:PivotalTrackerService"

[tool.poetry.scripts]
"bugwarrior" = "bugwarrior:cli"
"bugwarrior-pull" = "bugwarrior:pull"
"bugwarrior-vault" = "bugwarrior:vault"
"bugwarrior-uda" = "bugwarrior:uda"

[build-system]
requires = ["poetry>=0.12"]
build-backend = "poetry.masonry.api"
